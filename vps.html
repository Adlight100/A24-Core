<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A24 NOC - Cloud Health Rack</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #060913; color: #cbd5e1; padding: 16px; min-height: 100vh; }
        header { background-color: #090d1a; border: 1px solid #1e293b; padding: 14px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: bold; color: #10b981; text-transform: uppercase; text-decoration: none; }
        .back-btn { background: #0f172a; border: 1px solid #334155; color: #10b981; font-size: 11px; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-weight: bold; text-transform: uppercase; }
        .card { background: #0f172a; border: 1px solid #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
        .section-title { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #64748b; margin-bottom: 14px; font-family: monospace; tracking: 0.05em; }
        .sys-row { background: #020617; border: 1px solid #0f172a; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; font-family: monospace; }
        .sys-btn { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; font-size: 10px; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>
    <header>
        <a href="/dashboard" class="logo">🖥️ A24 CLOUD METRICS</a>
        <a href="/dashboard" class="back-btn">⬅️ Back Home</a>
    </header>

    <div class="card">
        <div class="section-title">🖥️ Virtual Private Server Core Hardware Parameters</div>
        <div class="sys-row">
            <div>Virtual Server Engine Operating System</div>
            <div style="color: #94a3b8; font-weight: bold;">Ubuntu 22.04 LTS</div>
        </div>
        <div class="sys-row">
            <div>VPS Kernel Cloud Hypervisor Status</div>
            <button class="sys-btn" onclick="alert('Soft reboot command packet dispatched to cloud hypervisor center.')">REBOOT VPS</button>
        </div>
        <div class="sys-row">
            <div>Active CPU Allocation (14% Average Load)</div>
            <div style="color: #10b981; font-weight: bold;">OPTIMAL RUNTIME</div>
        </div>
        <div class="sys-row">
            <div>Memory Matrix Usage (32% of 24GB Allocation)</div>
            <div style="color: #10b981; font-weight: bold;">HEALTHY RESOURCE POOL</div>
        </div>
    </div>
</body>
</html>
