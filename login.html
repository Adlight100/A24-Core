<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>A24 Advanced Data Channels - Security Gate</title>
                <script src="https://tailwindcss.com"></script>
                    <link rel="preconnect" href="https://googleapis.com">
                        <link rel="preconnect" href="https://gstatic.com" crossorigin>
                            <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
                                <script>
                                        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }
                                            </script>
                                                <style>
                                                        body { background-color: #060913; background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 24px 24px; }
                                                                .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
                                                                    </style>
                                                                    </head>
                                                                    <body class="font-sans text-slate-200 min-h-screen flex flex-col justify-between p-4 selection:bg-teal-500/30">
                                                                        <div class="w-full max-w-md mx-auto text-center mt-2">
                                                                                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">
                                                                                            <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span> SECURE MANAGEMENT PROTOCOL ACTIVE
                                                                                                    </span>
                                                                                                        </div>
                                                                                                            <main class="w-full max-w-md mx-auto my-auto py-6">
                                                                                                                    <div class="glass-panel border border-emerald-500/20 rounded-xl p-6 shadow-2xl shadow-black/80">
                                                                                                                                <div class="text-center mb-8">
                                                                                                                                                <div class="inline-block text-3xl font-bold tracking-tighter text-emerald-400 font-sans border-b-2 border-emerald-500/40 pb-1 mb-2">A24<span class="text-xs font-mono font-medium tracking-normal text-slate-400 ml-1">NOC</span></div>
                                                                                                                                                                <p class="text-xs font-mono tracking-widest text-slate-400 uppercase">Privileged Access Only</p>
                                                                                                                                                                            </div>
                                                                                                                                                                                        <form id="loginForm" class="space-y-5" onsubmit="handleAuth(event)">
                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Controller Username</label>
                                                                                                                                                                                                                                                <div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">👤</span></div>
                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                <div>
                                                                                                                                                                                                                                                                                                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Secret Passphrase</label>
                                                                                                                                                                                                                                                                                                                        <div class="relative"><span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">🔑</span><input id="passwordInput" type="password" required placeholder="••••••••••••••••" class="w-full h-[52px] bg-slate-900/60 border border-slate-700/60 rounded-lg pl-10 pr-12 text-sm font-medium focus:outline-none focus:border-emerald-500 transition-colors placeholder-slate-600"><button type="button" onclick="togglePassVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 text-xs font-mono">SHOW</button></div>
                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                        <div class="bg-slate-950/80 border border-slate-800 rounded-lg p-3.5 font-mono text-[11px] leading-relaxed space-y-1 text-slate-400">
                                                                                                                                                                                                                                                                                                                                                                            <div class="flex justify-between"><span>[CORE_STATE]</span><span class="text-emerald-400 font-medium">READY</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                <div class="flex justify-between items-center"><span>[DIAGNOSTIC_IP]</span><span id="liveIP" class="text-amber-400 font-medium animate-pulse">DETECTING...</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="flex justify-between"><span>[FW_ENFORCEMENT]</span><span class="text-slate-500">IP_LOCK_ENABLED</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="submit" id="submitBtn" class="w-full h-[54px] bg-teal-600 hover:bg-teal-500 active:scale-[0.99] text-white rounded-lg font-semibold tracking-wider text-sm shadow-lg shadow-teal-900/20 transition-all flex items-center justify-center gap-2 uppercase">🔓 Authenticate and Deploy</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <footer class="w-full text-center pb-2 text-[10px] font-mono tracking-wider text-slate-600 uppercase">System Node Tracker: ID-24-SECURE // Unauthorized connections logged immediately</footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function fetchDiagnosticIP() { try { const response = await fetch('https://ipify.org'); const data = await response.json(); document.getElementById('liveIP').innerText = data.ip; document.getElementById('liveIP').classList.remove('animate-pulse'); } catch (error) { document.getElementById('liveIP').innerText = '102.219.208.5 (MOCK)'; document.getElementById('liveIP').classList.remove('animate-pulse'); } }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    window.onload = fetchDiagnosticIP;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function togglePassVisibility() { const input = document.getElementById('passwordInput'); if (input.type === 'password') { input.type = 'text'; event.target.innerText = 'HIDE'; } else { input.type = 'password'; event.target.innerText = 'SHOW'; } }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function handleAuth(e) { e.preventDefault(); const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerHTML = 'SCANNING SECURITY MATRIX...'; setTimeout(() => { alert("A24 Authentication Successful. Transferring to Node Operations Control Panel..."); btn.innerHTML = "🔓 AUTHENTICATE AND DEPLOY"; btn.disabled = false; }, 2000); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
